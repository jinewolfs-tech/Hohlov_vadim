<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата - Brawl Stars Shop</title>
    <link rel="stylesheet" href="paybrawl.css">
</head>
<body>
    <form action="product.html" method="POST">
        <h1 class="heading">Введи данные SuperCell ID</h1>

        <div class="input-group">
            <label for="email">Почта</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>

        <div class="input-group">
            <label for="code">Последний код от SuperCell</label>
            <input type="text" id="code" name="code" placeholder="123456" required>
        </div>

        <a href="#" class="forgot_password">Забыли код?</a>

        <div class="button__wrapper">
            <button type="submit" class="buy-btn">Купить</button>
            <a href="brawl.html" class="back-btn">Вернуться обратно</a>
        </div>
    </form>
</body>
</html>
