<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Game Shop</title>
    <link rel="stylesheet" href="Registration.css">
</head>
<body>

    <div class="form-container">
        <div class="reg-card">
            <h1 class="heading">Регистрация</h1>
            
            <form action="#" method="POST">
                <!-- Логин -->
                <div class="input-group">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" placeholder="Ваш логин" required>
                </div>

                <!-- Номер карты -->
                <div class="input-group">
                    <label for="card">Номер карты</label>
                    <input type="text" id="card" name="card" placeholder="0000 0000 0000 0000" required>
                </div>

                <!-- Пароль -->
                <div class="input-group">
                    <label for="password">Придумай пароль</label>
                    <input type="password" id="password" name="password" placeholder="••••••" required>
                </div>

                <!-- Повтор пароля -->
                <div class="input-group">
                    <label for="password-repeat">Повтори пароль</label>
                    <input type="password" id="password-repeat" name="password-repeat" placeholder="••••••" required>
                </div>

                <!-- Кнопки -->
                <div class="buttons-group">
                    <button type="submit" class="btn-primary">Вперёд!</button>
                    <a href="vhod.html" class="btn-secondary">У тебя уже есть аккаунт? Войди!</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
