<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт - Game Shop</title>
    <link rel="stylesheet" href="vhod.css">
</head>
<body>

    <div class="form-container">
        <div class="auth-card">
            <h1 class="heading">Вход в аккаунт</h1>
            
            <form action="choise.html" method="POST">
                <!-- Почта -->
                <div class="input-group">
                    <label for="email">Почта</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>

                <!-- Пароль -->
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="••••••" required>
                </div>

                <!-- Забыли пароль (ОТДЕЛЬНЫЙ БЛОК, чтобы не накладывался) -->
                <div class="forgot-wrapper">
                    <a href="#" class="forgot-password">Забыли пароль?</a>
                </div>

                <!-- Кнопки -->
                <div class="buttons-group">
                    <a href="choise.html" class="btn-primary">Войти</a>
                    <a href="index.html" class="btn-secondary">Нет аккаунта? Зарегистрируйся!</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
