<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush Royale - Оплата</title>
    <link rel="stylesheet" href="rushpay.css">
</head>
<body>

    <div class="form-container">
        <form class="pay-card" action="Product1.html" method="POST">
            <h1 class="heading">Введи свои данные из Rush Royale</h1>
            
            <div class="input-group">
                <label for="rush_id">Введи свой ID</label>
                <input type="text" id="rush_id" name="rush_id" placeholder="Например: 12345678" required>
            </div>

            <div class="buttons-group">
                <button type="submit" class="btn-primary">Купить</button>
                <a href="rush.html" class="btn-secondary">Вернуться обратно</a>
            </div>
        </form>
    </div>

</body>
</html>
